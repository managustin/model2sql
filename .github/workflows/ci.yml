name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c-flex-bison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison
      - name: Build and test
        run: make test
