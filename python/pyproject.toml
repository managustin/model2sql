[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model2sql"
version = "0.1.0"
description = "Transpilador de archivos .model a SQL DDL (CREATE TABLE)."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
model2sql = "model2sql.cli:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, N: nombres, B: bugs comunes,
# UP: sintaxis moderna, SIM: simplificaciones, C90: complejidad ciclomática.
select = ["E", "F", "I", "N", "B", "UP", "SIM", "C90"]
# N818 exige el sufijo "Error"; en español va como prefijo (ErrorLexico).
ignore = ["N818"]

[tool.ruff.lint.mccabe]
max-complexity = 8
